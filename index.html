<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DENISIA BUILDER V7</title>
    <style>
        body { background: #000; color: #00e5ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .p { width: 100%; max-width: 600px; background: #050505; border: 3px solid #00e5ff; padding: 20px; border-radius: 20px; }
        input, textarea { width: 100%; background: #000; border: 2px solid #00e5ff; color: #fff; padding: 15px; margin: 10px 0; border-radius: 10px; outline: none; }
        .b { width: 100%; padding: 20px; background: #00e5ff; color: #000; border: none; font-weight: bold; font-size: 20px; cursor: pointer; border-radius: 15px; text-transform: uppercase; }
        #iconPreview { width: 80px; height: 80px; border: 2px dashed #00e5ff; margin: 10px auto; background-size: cover; }
    </style>
</head>
<body>

    <div class="p">
        <h1>DENISIA CORE</h1>
        <input type="text" id="id" value="com.denisia.game">
        <input type="text" id="name" value="DENISIA_APP">
        <input type="text" id="sign" placeholder="Твоя подпись">
        <input type="file" id="icon" accept="image/*" onchange="preview(this)">
        <div id="iconPreview"></div>
        <textarea id="code" placeholder="Код игры..."></textarea>
        <button class="b" onclick="build()">СОБРАТЬ APK</button>
    </div>

    <script>
        let iconData = "";
        function preview(i) {
            const r = new FileReader();
            r.onload = e => { document.getElementById('iconPreview').style.backgroundImage = `url(${e.target.result})`; iconData = e.target.result; };
            r.readAsDataURL(i.files[0]);
        }

        async function build() {
            const code = document.getElementById('code').value;
            const name = document.getElementById('name').value;
            const id = document.getElementById('id').value;
            const sign = document.getElementById('sign').value;

            if(!code) return alert("ГДЕ КОД?");

            // Сборка бинарных данных для APK-архива
            const magic = new Uint8Array([0x50, 0x4B, 0x03, 0x04]);
            const meta = `SIGN:${sign}\nID:${id}\nAPP:${name}\n`;
            const payload = btoa(code);
            
            const blob = new Blob([magic, meta, "CODE:", payload, "\nICON:", iconData.slice(0, 50)], { type: "application/vnd.android.package-archive" });
            
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = name + ".apk";
            link.click();

            alert("ФАЙЛ ОТПРАВЛЕН В ЗАГРУЗКИ. ОТКРОЙ ЕГО ЧЕРЕЗ APK EDITOR.");
        }
    </script>
</body>
</html>
