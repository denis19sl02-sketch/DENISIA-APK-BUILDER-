<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DENISIAGRAM | SPOTIFY EDITION</title>
    <style>
        :root { --neon: #00ffcc; --bg: #000; --card: #0d0d0d; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { border-bottom: 2px solid var(--neon); padding: 15px; background: #050505; text-align: center; box-shadow: 0 0 20px var(--neon); z-index: 10; }
        h1 { letter-spacing: 10px; margin: 0; font-size: 1.8rem; text-shadow: 0 0 10px var(--neon); }

        main { display: flex; flex: 1; overflow: hidden; }
        
        /* ЦЕНТРАЛЬНЫЙ ПОТОК YOUTUBE */
        .video-feed { flex: 2.5; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; border-right: 1px solid #1a1a1a; }
        .video-card { background: var(--card); border: 1px solid #222; border-radius: 12px; overflow: hidden; transition: 0.3s; }
        .video-card:hover { border-color: var(--neon); }
        .video-card iframe { width: 100%; height: 200px; border: none; }

        /* ПРАВАЯ ПАНЕЛЬ: ТОЛЬКО SPOTIFY */
        .side-panel { flex: 1.5; background: #050505; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .spotify-wrapper { border: 2px solid var(--neon); border-radius: 15px; overflow: hidden; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); background: #000; }
        
        h2 { font-size: 10px; text-align: center; letter-spacing: 3px; color: var(--neon); text-transform: uppercase; margin: 5px 0; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon); }
    </style>
</head>
<body>

<header>
    <h1>DENISIAGRAM</h1>
</header>

<main>
    <section class="video-feed" id="main-feed">
        </section>

    <aside class="side-panel">
        
        <h2>[ AUDIO SECTOR: STREAM 1 ]</h2>
        <div class="spotify-wrapper">
            <iframe src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM3M?utm_source=generator&theme=0" 
                width="100%" height="152" frameBorder="0" allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
        </div>

        <h2>[ AUDIO SECTOR: STREAM 2 ]</h2>
        <div class="spotify-wrapper">
            <iframe src="https://open.spotify.com/embed/playlist/37i9dQZF1DX4cmS_pS9S3C?utm_source=generator&theme=0" 
                width="100%" height="152" frameBorder="0" allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
        </div>

        <h2>[ AUDIO SECTOR: STREAM 3 ]</h2>
        <div class="spotify-wrapper">
            <iframe src="https://open.spotify.com/embed/playlist/37i9dQZF1DX8890hptSj02?utm_source=generator&theme=0" 
                width="100%" height="152" frameBorder="0" allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
        </div>

    </aside>
</main>

<script>
    const API_KEY = "AIzaSyBUD-MJyPa8WzuE7jPM2NP4gMYM73Caxt8";

    async function loadContent() {
        const feed = document.getElementById('main-feed');
        try {
            const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=6&q=future+technology+2026&type=video&key=${API_KEY}`);
            const data = await res.json();
            data.items.forEach(v => {
                feed.innerHTML += `<div class="video-card"><iframe src="https://www.youtube.com/embed/${v.id.videoId}"></iframe></div>`;
            });
        } catch (e) { console.log("System loading..."); }
    }
    loadContent();
</script>

</body>
</html>
